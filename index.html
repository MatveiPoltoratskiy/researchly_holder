<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Researchly — Change the world</title>
<meta name="description" content="Researchly helps high school and undergrad students find research opportunities matched to them, through a short guided interview. Join the waitlist.">
<style>
  :root{
    --cover:#C6602F; --cover-light:#E08A54; --cover-dark:#8C3F1E;
    --spine:#7A3418; --pages:#F3E3C8; --pages-shadow:#E4CBA0; --ribbon:#3F7D5C;
    --face:#3B2A1E; --gold:#D9A441;
    --wood-deep:#1B120C; --wood-mid:#2E2015;
    --lamp-warm:#F4B36B; --lamp-core:#FFE3B0; --parchment:#F3E7CE;
    --dusk-cool:#1A1B21;
    --glass-rim:#A08A63; --glass-rim-dark:#7C6A4C; --glass-lens:rgba(232,232,222,.14);

    --container-max-width: 1280px;
    --container-pad: 64px;
  }
  @media (max-width: 1023px){ :root{ --container-pad: 40px; } }
  @media (max-width: 767px){ :root{ --container-pad: 32px; } }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    display:flex; flex-direction:column;
    background: var(--wood-deep);
    color: var(--parchment);
    font-family: Georgia, "Iowan Old Style", serif;
    overflow-x:hidden;
  }
  svg{ display:block; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- layout container (single source of truth) ---------- */
  .container{
    width:100%;
    max-width: var(--container-max-width);
    margin: 0 auto;
    padding-left: var(--container-pad);
    padding-right: var(--container-pad);
  }

  /* ---------- nav ---------- */
  .site-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 22px; padding-bottom: 22px;
    position:relative; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand svg{ width:37px; height:37px; }
  .brand span{
    font-size:19px; font-weight:600; letter-spacing:-.01em;
    color: var(--parchment);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  .nav-cta{
    font-family:"Segoe UI",system-ui,sans-serif; font-size:14.5px; font-weight:700;
    border:none; cursor:pointer;
    background: var(--parchment); color: var(--wood-deep);
    padding:13px 25px; border-radius:999px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .nav-cta:hover{ transform: translateY(-1px); box-shadow: 0 8px 18px -8px rgba(0,0,0,.5); }

  /* ---------- hero shell ---------- */
  .hero{
    position:relative; flex:1; overflow:hidden;
    display:flex; align-items:center;
    min-height: 660px;
    background-color: var(--wood-deep);
  }
  /* layer 1 — blurred library backdrop, tiled from a small clean photo patch (no mascot/lamp/text baked in) */
  .library-bg{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image: url('assets/library-bg.jpg');
    background-repeat: repeat;
    background-size: 580px 460px;
    opacity:.85;
  }
  .hero-inner{
    position:relative; z-index:4; width:100%; height:100%;
    display:flex; align-items:center; justify-content:space-between; gap:32px;
  }

  /* ---------- hanging lamp: fixture is always visible; the bulb/glow/embers animate the on-sequence ---------- */
  .lamp-rig{ position:absolute; right: 9%; top:0; z-index:5; display:flex; flex-direction:column; align-items:center; }
  .lamp-cord{ width:2px; height: 50px; background: linear-gradient(180deg, var(--wood-mid), #150e09); }
  .lamp-fixture{ width: 128px; height: 92px; overflow:visible; }
  .lamp-bulb{
    width:15px; height:15px; border-radius:50%; margin-top:-10px;
    background: var(--lamp-core);
    box-shadow: 0 0 30px 13px rgba(244,179,107,.82);
    opacity:0;
    animation: bulb-flicker 2.4s ease-out forwards;
  }
  .lamp-embers{ position:absolute; left:50%; top:118px; width:0; height:0; pointer-events:none; }
  .ember{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background: var(--lamp-core);
    box-shadow: 0 0 6px 2px rgba(244,179,107,.75);
    opacity:0;
    animation: ember-drift 1.05s ease-out both;
  }

  /* light spreading outward from the lamp — this, not a page-wide fade, is what reveals the scene */
  .lamp-glow{
    position:absolute; right: -10%; top: -12%;
    width: 1320px; height: 1320px; border-radius:50%;
    background: radial-gradient(circle, var(--lamp-warm) 0%, rgba(244,179,107,.5) 32%, rgba(244,179,107,.15) 58%, rgba(244,179,107,0) 76%);
    mix-blend-mode: screen;
    z-index:1;
    transform-origin: 70% 18%;
    opacity:0; transform:scale(.22);
    animation: glow-flicker 2.4s ease-out forwards;
  }

  /* dust catching the light — only appears once the lamp has stabilized */
  .dust-field{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; animation: dust-reveal 1.2s ease-out 2.4s forwards; }
  .dust{ position:absolute; width:3px; height:3px; border-radius:50%; background: var(--lamp-core); opacity:.5; animation: dust-drift 16s linear infinite; }

  /* copy */
  .hero-text{ position:relative; z-index:4; max-width: 480px; flex: 0 1 480px; animation: content-in .9s ease-out 2s both; }
  .kicker{
    font-family:"Segoe UI",system-ui,sans-serif; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; margin:0 0 16px; font-weight:700;
    color: var(--lamp-warm);
    background: linear-gradient(100deg, var(--lamp-warm) 35%, #FFF3DD 50%, var(--lamp-warm) 65%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    font-weight: 800;
    font-size: clamp(46px, 5.9vw, 76px);
    line-height:1.02;
    color: var(--parchment);
    text-wrap: balance;
  }
  .tagline{
    margin: 12px 0 0;
    font-family: "Iowan Old Style",Palatino,Georgia,serif;
    font-weight: 600; font-style: normal; letter-spacing:.01em;
    font-size: clamp(19px, 2.1vw, 23px);
    color: var(--lamp-warm);
  }
  .sub{
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size: 16.5px; line-height:1.6; color: rgba(243,231,206,.72);
    max-width: 420px; margin: 18px 0 0;
  }
  .cta-wrap{ margin-top: 30px; }
  .cta-btn{
    font-family:"Segoe UI",system-ui,sans-serif; font-weight:700; font-size:15.5px;
    border:none; cursor:pointer; display:inline-flex; align-items:center; gap:10px;
    background: var(--cover); color: #FFF7EC;
    padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 14px 26px -10px rgba(0,0,0,.6);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .cta-btn:hover{ transform: translateY(-2px); box-shadow: 0 18px 30px -10px rgba(0,0,0,.65); }

  /* mascot — floating, upper right, holding the magnifying glass */
  .mascot-focal{
    position:relative; z-index:4; flex: 1 1 420px; min-width:340px;
    display:flex; align-items:center; justify-content:center;
    transform: translate(10%, -14%);
  }
  .mascot-figure{
    position:relative; width:100%; max-width:560px; aspect-ratio: 1 / 1.08;
    display:flex; align-items:center; justify-content:center;
    animation: mascot-enter .5s ease-in-out 1.8s both;
  }
  .mascot-highlight{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width: 115%; height: 100%; border-radius:50%;
    background: radial-gradient(circle, rgba(255,227,176,.5) 0%, rgba(255,227,176,0) 68%);
    mix-blend-mode: screen;
  }
  .mascot-instance{ width: 84%; height:auto; position:relative; z-index:2; }
  .mascot-wave-arm{ transform-box: fill-box; transform-origin: 15% 40%; }

  @media (prefers-reduced-motion: no-preference){
    .mascot-instance{ animation: mascot-float 5.2s ease-in-out infinite; }
    .mascot-wave-arm{ animation: wave-arm 1.5s ease-in-out 2.2s 1; }
    .kicker{ animation: kicker-shimmer 3.2s ease-in-out 3s infinite; }
  }
  @keyframes mascot-float{
    0%,100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-14px) rotate(-6deg); }
  }
  @keyframes wave-arm{
    0%{ transform: rotate(0deg); } 20%{ transform: rotate(-20deg); }
    38%{ transform: rotate(6deg); } 56%{ transform: rotate(-15deg); }
    74%{ transform: rotate(3deg); } 100%{ transform: rotate(0deg); }
  }
  @keyframes mascot-enter{
    0%{ opacity:0; transform: translateX(-68vw) rotate(-4deg); }
    100%{ opacity:1; transform: translateX(0) rotate(-4deg); }
  }
  @keyframes kicker-shimmer{
    0%{ background-position: 160% 0; }
    100%{ background-position: -60% 0; }
  }
  @keyframes content-in{ 0%{opacity:0; transform:translateY(14px);} 100%{opacity:1; transform:translateY(0);} }

  /* lamp on-sequence: two irregular flickers, then fully on and stable */
  @keyframes bulb-flicker{
    0%{opacity:0;} 5%{opacity:.5;} 8%{opacity:.08;} 9%{opacity:.05;}
    27%{opacity:.06;} 34%{opacity:.75;} 38%{opacity:.1;}
    44%{opacity:.55;} 55%{opacity:.8;} 68%{opacity:.92;} 100%{opacity:1;}
  }
  @keyframes glow-flicker{
    0%{opacity:0; transform:scale(.22);} 5%{opacity:.4; transform:scale(.3);}
    8%{opacity:.05; transform:scale(.26);} 9%{opacity:.03; transform:scale(.26);}
    27%{opacity:.04; transform:scale(.28);} 34%{opacity:.55; transform:scale(.5);}
    38%{opacity:.08; transform:scale(.4);}
    44%{opacity:.42; transform:scale(.58);} 55%{opacity:.68; transform:scale(.76);}
    68%{opacity:.88; transform:scale(.92);} 100%{opacity:1; transform:scale(1);}
  }
  @keyframes ember-drift{
    0%{ opacity:0; transform: translate(0,0) scale(1); }
    15%{ opacity:.9; }
    100%{ opacity:0; transform: translate(var(--ex,6px), 60px) scale(.4); }
  }
  @keyframes dust-reveal{ 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes dust-drift{
    0%{ transform: translate(0,0); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.35; }
    100%{ transform: translate(14px,-140px); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .lamp-bulb{ animation:none; opacity:1; }
    .lamp-glow{ animation:none; opacity:1; transform:scale(1); }
    .lamp-embers{ display:none; }
    .dust-field{ animation:none; opacity:1; }
    .dust{ animation:none; }
    .hero-text{ animation:none; opacity:1; transform:none; }
    .mascot-figure{ animation:none; opacity:1; transform: rotate(-4deg); }
    .mascot-wave-arm{ animation:none; }
    .kicker{ animation:none; }
  }

  /* ---------- Card Catalog Confetti ---------- */
  .confetti-piece{
    position:fixed; width:11px; height:7px; border-radius:1.5px;
    pointer-events:none; z-index:200; opacity:1;
    transform: translate(-50%,-50%);
    animation: confetti-pop .85s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes confetti-pop{
    0%{ transform: translate(-50%,-50%) translate(0,0) rotate(0deg); opacity:1; }
    65%{ opacity:1; }
    100%{ transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  /* ---------- scroll: bridge into a cooler tone ---------- */
  .after-hero{
    height: 46vh; background: var(--wood-deep);
    transition: background-color .8s ease;
  }
  .after-hero.tone-cool{ background: var(--dusk-cool); }

  /* ---------- mobile ---------- */
  @media (max-width: 860px){
    .site-nav{ padding-top: 18px; padding-bottom: 18px; }
    .hero{ min-height: 700px; }
    .hero-inner{
      flex-direction:column; align-items:center; justify-content:flex-end;
      text-align:center; padding-top: 32px; padding-bottom: 40px; height:auto;
    }
    .hero-text{ max-width:100%; order:2; }
    .sub{ margin-left:auto; margin-right:auto; }
    .lamp-rig{ right:auto; left:50%; transform:translateX(-50%); }
    .lamp-glow{ right:auto; left:50%; top:-30%; width:1000px; height:1000px; transform-origin:50% 30%; margin-left:-500px; }
    .mascot-focal{ order:1; flex:0 0 auto; margin-bottom:8px; transform:none; }
    .mascot-figure{ max-width:320px; }
  }
</style>
</head>
<body>

<svg class="visually-hidden" aria-hidden="true">
  <defs>
    <symbol id="mascot-idle" viewBox="0 0 240 260">
      <polygon points="60,40 150,40 172,62 172,188 150,210 60,210 38,188 38,62" fill="var(--cover)"/>
      <polygon points="38,62 172,62 172,125 38,125" fill="var(--cover-light)" opacity=".55"/>
      <polygon points="38,150 172,150 172,188 150,210 60,210 38,188" fill="var(--cover-dark)" opacity=".35"/>
      <polygon points="38,62 38,188 18,175 18,75" fill="var(--spine)"/>
      <polygon points="38,62 172,62 192,45 58,45" fill="var(--pages)"/>
      <polygon points="172,62 192,45 192,172 172,188" fill="var(--pages-shadow)"/>
      <polygon points="100,45 116,45 120,100 108,84 96,100" fill="var(--ribbon)"/>
      <polygon points="38,130 18,140 22,162 40,155" fill="var(--cover-dark)"/>
      <polygon class="mascot-wave-arm" points="172,130 192,140 188,162 170,155" fill="var(--cover-dark)"/>
      <polygon points="26.4,150.5 17.6,190.3 14.4,189.7 21.6,149.5" fill="var(--glass-rim-dark)"/>
      <circle cx="13.5" cy="203" r="13" fill="var(--glass-lens)" stroke="var(--glass-rim)" stroke-width="4"/>
      <polygon points="66,210 90,210 84,236 70,236" fill="var(--cover-dark)"/>
      <polygon points="120,210 144,210 140,236 126,236" fill="var(--cover-dark)"/>
      <ellipse cx="68" cy="132" rx="9" ry="5" fill="var(--ribbon)" opacity=".35"/>
      <ellipse cx="144" cy="132" rx="9" ry="5" fill="var(--ribbon)" opacity=".35"/>
      <circle cx="88" cy="118" r="6.5" fill="var(--face)"/>
      <circle cx="124" cy="118" r="6.5" fill="var(--face)"/>
      <path d="M80,142 Q106,158 132,142" stroke="var(--face)" stroke-width="6" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="mascot-tiny" viewBox="0 0 60 60">
      <polygon points="14,10 40,10 48,18 48,46 40,54 14,54 8,46 8,18" fill="var(--cover)"/>
      <polygon points="8,18 40,18 46,12 16,12" fill="var(--pages)"/>
      <polygon points="26,12 32,12 34,28 29,22 24,28" fill="var(--ribbon)"/>
      <circle cx="21" cy="30" r="2.3" fill="var(--face)"/>
      <circle cx="33" cy="30" r="2.3" fill="var(--face)"/>
      <path d="M19,37 Q27,43 35,37" stroke="var(--face)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="site-nav container">
  <div class="brand">
    <svg viewBox="0 0 60 60"><use href="#mascot-tiny"/></svg>
    <span>Researchly</span>
  </div>
  <button class="nav-cta" type="button" id="navCta">Join the waitlist</button>
</div>

<div class="hero">
  <div class="library-bg" aria-hidden="true"></div>

  <div class="lamp-rig">
    <div class="lamp-cord"></div>
    <svg class="lamp-fixture" viewBox="0 0 140 100">
      <defs>
        <linearGradient id="shadeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#F3D191"/>
          <stop offset="55%" stop-color="var(--gold)"/>
          <stop offset="100%" stop-color="var(--cover-dark)"/>
        </linearGradient>
        <radialGradient id="shadeInner" cx="50%" cy="10%" r="75%">
          <stop offset="0%" stop-color="#3A2A12" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#1B120C" stop-opacity=".95"/>
        </radialGradient>
      </defs>
      <rect x="60" y="0" width="20" height="8" rx="3" fill="var(--wood-mid)"/>
      <polygon points="52,8 88,8 132,84 8,84" fill="url(#shadeGrad)"/>
      <polygon points="52,8 88,8 82,20 58,20" fill="#F8E2B2" opacity=".65"/>
      <polygon points="88,8 132,84 106,84 76,16" fill="#000000" opacity=".14"/>
      <ellipse cx="70" cy="84" rx="62" ry="7" fill="var(--wood-mid)" opacity=".55"/>
      <ellipse cx="70" cy="80" rx="50" ry="9" fill="url(#shadeInner)"/>
    </svg>
    <div class="lamp-bulb"></div>
    <div class="lamp-embers" aria-hidden="true">
      <span class="ember" style="left:-14px; top:0; --ex:-10px; animation-delay:.1s;"></span>
      <span class="ember" style="left:6px; top:4px; --ex:14px; animation-delay:.4s;"></span>
      <span class="ember" style="left:-4px; top:-6px; --ex:2px; animation-delay:.65s;"></span>
      <span class="ember" style="left:12px; top:-2px; --ex:20px; animation-delay:.9s;"></span>
      <span class="ember" style="left:-16px; top:6px; --ex:-18px; animation-delay:1.15s;"></span>
      <span class="ember" style="left:2px; top:2px; --ex:-6px; animation-delay:1.4s;"></span>
    </div>
  </div>
  <div class="lamp-glow" aria-hidden="true"></div>

  <div class="dust-field" aria-hidden="true">
    <span class="dust" style="left:52%;top:18%;animation-delay:-2s;"></span>
    <span class="dust" style="left:61%;top:34%;animation-delay:-6s;"></span>
    <span class="dust" style="left:70%;top:12%;animation-delay:-9s;"></span>
    <span class="dust" style="left:66%;top:52%;animation-delay:-3s;"></span>
    <span class="dust" style="left:78%;top:40%;animation-delay:-11s;"></span>
    <span class="dust" style="left:58%;top:66%;animation-delay:-1s;"></span>
    <span class="dust" style="left:85%;top:24%;animation-delay:-7s;"></span>
    <span class="dust" style="left:73%;top:70%;animation-delay:-4.5s;"></span>
    <span class="dust" style="left:48%;top:44%;animation-delay:-13s;"></span>
    <span class="dust" style="left:90%;top:58%;animation-delay:-8.5s;"></span>
  </div>

  <div class="hero-inner container">
    <div class="hero-text">
      <p class="kicker">Waitlist now open</p>
      <h1>Researchly</h1>
      <p class="tagline">Change the world.</p>
      <p class="sub">A short guided interview turns "I don't know where to start" into a personalized map of research programs worth applying to.</p>
      <div class="cta-wrap">
        <button class="cta-btn" type="button" id="heroCta">Join the waitlist →</button>
      </div>
    </div>

    <div class="mascot-focal">
      <div class="mascot-figure">
        <div class="mascot-highlight"></div>
        <svg class="mascot-instance" viewBox="0 0 240 260"><use href="#mascot-idle"/></svg>
      </div>
    </div>
  </div>
</div>

<section class="after-hero" id="afterHero" aria-hidden="true"></section>

<script>
  (function(){
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Card Catalog Confetti: a burst of small index-card particles on CTA hover/click.
    var confettiColors = ['var(--cover)', 'var(--gold)', 'var(--lamp-warm)', 'var(--ribbon)'];
    function burstConfetti(originEl, count){
      if (reduceMotion || !originEl) return;
      var rect = originEl.getBoundingClientRect();
      var originX = rect.left + rect.width / 2;
      var originY = rect.top + rect.height * 0.3;
      var pieces = [];
      for (var i = 0; i < count; i++){
        var el = document.createElement('span');
        el.className = 'confetti-piece';
        var angle = (Math.random() * 150 - 75) * Math.PI / 180;
        var dist = 70 + Math.random() * 90;
        var dx = Math.sin(angle) * dist;
        var dy = -Math.abs(Math.cos(angle) * dist) - 36;
        el.style.setProperty('--dx', dx + 'px');
        el.style.setProperty('--dy', dy + 'px');
        el.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        el.style.background = confettiColors[i % confettiColors.length];
        el.style.left = originX + 'px';
        el.style.top = originY + 'px';
        el.style.animationDelay = (Math.random() * 70) + 'ms';
        pieces.push(el);
        document.body.appendChild(el);
      }
      setTimeout(function(){
        pieces.forEach(function(p){ p.remove(); });
      }, 1000);
    }

    [document.getElementById('heroCta'), document.getElementById('navCta')].forEach(function(btn){
      if (!btn) return;
      btn.addEventListener('mouseenter', function(){ burstConfetti(btn, 5); });
      btn.addEventListener('click', function(){ burstConfetti(btn, 16); });
    });

    // Scroll past the hero -> bridge into a cooler tone.
    var afterHero = document.getElementById('afterHero');
    if (afterHero && 'IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          afterHero.classList.toggle('tone-cool', entry.isIntersecting);
        });
      }, { threshold: 0.2 });
      io.observe(afterHero);
    }
  })();
</script>

<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
