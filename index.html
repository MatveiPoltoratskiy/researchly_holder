<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Researchly — Change the world</title>
<meta name="description" content="Researchly helps high school and undergrad students find research opportunities matched to them, through a short guided interview. Join the waitlist.">
<style>
  :root{
    --cover:#C6602F; --cover-light:#E08A54; --cover-dark:#8C3F1E;
    --spine:#7A3418; --pages:#F3E3C8; --pages-shadow:#E4CBA0; --ribbon:#3F7D5C;
    --face:#3B2A1E; --gold:#D9A441;
    --wood-deep:#1B120C; --wood-mid:#2E2015; --wood-shelf:#3F2C1C;
    --lamp-warm:#F4B36B; --lamp-core:#FFE3B0; --parchment:#F3E7CE;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    display:flex; flex-direction:column;
    background: var(--wood-deep);
    color: var(--parchment);
    font-family: Georgia, "Iowan Old Style", serif;
    overflow-x:hidden;
  }
  svg{ display:block; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- nav ---------- */
  .site-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 44px; position:relative; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ width:30px; height:30px; }
  .brand span{
    font-size:18px; font-weight:600; letter-spacing:-.01em;
    color: var(--parchment);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  .nav-cta{
    font-family:"Segoe UI",system-ui,sans-serif; font-size:13.5px; font-weight:700;
    border:none; cursor:pointer;
    background: var(--parchment); color: var(--wood-deep);
    padding:11px 20px; border-radius:999px;
  }

  /* ---------- hero shell ---------- */
  .hero{
    position:relative; flex:1; overflow:hidden;
    display:flex; align-items:center;
    padding: 0 64px; min-height: 560px;
  }

  /* library shelving backdrop */
  .lib-shelves{ position:absolute; inset:0; z-index:0; }
  .shelf-row{
    position:absolute; left:-4%; right:-4%; height: 52px;
    display:flex; align-items:flex-end; gap:5px;
    filter: blur(1.5px);
  }
  .shelf-row::after{
    content:""; position:absolute; left:0; right:0; bottom:-7px; height:7px;
    background: linear-gradient(180deg, var(--wood-shelf), var(--wood-mid));
  }
  .shelf-row span{ flex:1; align-self:flex-end; height:70%; border-radius:2px 2px 0 0; background: var(--wood-shelf); }
  .shelf-row span:nth-child(3n){ background:#4A3420; height:88%; }
  .shelf-row span:nth-child(5n){ background:#5C4128; height:62%; }
  .shelf-row span:nth-child(7n){ background:#2A1D14; height:96%; }

  /* copy */
  .hero-text{ position:relative; z-index:4; max-width: 460px; animation: content-in .9s ease-out 1.9s both; }
  .kicker{
    font-family:"Segoe UI",system-ui,sans-serif; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--lamp-warm); margin:0 0 16px; font-weight:700;
  }
  h1{
    margin:0;
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    font-weight: 500;
    font-size: clamp(42px, 5.6vw, 72px);
    line-height:1.04;
    color: var(--parchment);
    text-wrap: balance;
  }
  .tagline{
    margin: 10px 0 0;
    font-family: "Iowan Old Style",Palatino,Georgia,serif;
    font-style: italic;
    font-size: clamp(18px, 2vw, 22px);
    color: var(--lamp-warm);
  }
  .sub{
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size: 15.5px; line-height:1.6; color: rgba(243,231,206,.72);
    max-width: 400px; margin: 18px 0 0;
  }
  .cta-wrap{ margin-top: 30px; }
  .cta-btn{
    font-family:"Segoe UI",system-ui,sans-serif; font-weight:700; font-size:15.5px;
    border:none; cursor:pointer; display:inline-flex; align-items:center; gap:10px;
    background: var(--cover); color: #FFF7EC;
    padding: 16px 34px; border-radius: 999px;
    box-shadow: 0 14px 26px -10px rgba(0,0,0,.6);
  }

  /* hanging lamp, right side */
  .lamp-rig{ position:absolute; right: 13%; top:0; z-index:5; display:flex; flex-direction:column; align-items:center; }
  .lamp-cord{ width:2px; height: 56px; background: linear-gradient(180deg, var(--wood-mid), #150e09); }
  .lamp-fixture{ width: 92px; height: 60px; overflow:visible; }
  .lamp-bulb{
    width:14px; height:14px; border-radius:50%; margin-top:-8px;
    background: var(--lamp-core);
    box-shadow: 0 0 26px 11px rgba(244,179,107,.8);
    animation: lamp-flicker 2.6s ease-out forwards;
  }

  /* light spreading from the lamp */
  .lamp-glow{
    position:absolute; right: -8%; top: -10%;
    width: 980px; height: 980px; border-radius:50%;
    background: radial-gradient(circle, var(--lamp-warm) 0%, rgba(244,179,107,.55) 30%, rgba(244,179,107,.12) 55%, rgba(244,179,107,0) 72%);
    mix-blend-mode: screen;
    z-index:1;
    transform-origin: 70% 18%;
    animation: glow-flicker 2.6s ease-out forwards;
  }
  .dark-veil{
    position:absolute; inset:0; z-index:6; pointer-events:none;
    background: var(--wood-deep);
    animation: veil-fade 2.6s ease-out forwards;
  }

  /* dust catching the light */
  .dust-field{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; animation: fade-in 1.4s ease-out 1.6s forwards; }
  .dust{ position:absolute; width:3px; height:3px; border-radius:50%; background: var(--lamp-core); opacity:.5; animation: dust-drift 16s linear infinite; }

  /* signature book, focal point beneath the lamp */
  .book-focal{
    position:absolute; right: 15%; bottom: 6%; z-index:4;
    width: 320px; height: 300px;
    display:flex; align-items:flex-end; justify-content:center;
    animation: content-in 1s ease-out 2s both;
  }
  .book-shadow{
    position:absolute; bottom: 4px; width: 210px; height: 34px;
    background: radial-gradient(ellipse, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 72%);
    filter: blur(2px);
  }
  .book-highlight{
    position:absolute; left:50%; bottom: 20px; transform: translateX(-50%);
    width: 300px; height: 300px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,227,176,.55) 0%, rgba(255,227,176,0) 68%);
    mix-blend-mode: screen;
  }
  .book-stack{ position:absolute; bottom: 10px; left:50%; transform: translateX(-50%); display:flex; align-items:flex-end; gap:0; z-index:1; }
  .book{ width:150px; height:26px; border-radius:4px; margin-top:-6px; }
  .book.b1{ background:var(--spine); transform: rotate(-2deg); width:190px; }
  .book.b2{ background:var(--gold); transform: rotate(1.5deg); width:170px; }
  .book.b3{ background:var(--ribbon); transform: rotate(-1deg); width:150px; }
  .mascot-instance{ width: 232px; height:252px; position:relative; z-index:2; }

  @media (prefers-reduced-motion: no-preference){
    .anim-bob{ animation: bob 5s ease-in-out infinite; }
  }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-9px); } }

  @keyframes veil-fade{
    0%{opacity:.97;} 8%{opacity:.6;} 14%{opacity:.95;} 22%{opacity:.5;}
    28%{opacity:.92;} 36%{opacity:.35;} 55%{opacity:.12;} 75%{opacity:.02;} 100%{opacity:0;}
  }
  @keyframes glow-flicker{
    0%{opacity:0; transform:scale(.32);} 8%{opacity:.5; transform:scale(.46);}
    14%{opacity:.06; transform:scale(.38);} 22%{opacity:.65; transform:scale(.58);}
    28%{opacity:.1; transform:scale(.46);} 36%{opacity:.8; transform:scale(.76);}
    55%{opacity:.95; transform:scale(.96);} 75%{opacity:1; transform:scale(1.03);}
    100%{opacity:1; transform:scale(1);}
  }
  @keyframes lamp-flicker{
    0%{opacity:.05;} 8%{opacity:.55;} 14%{opacity:.08;} 22%{opacity:.7;}
    28%{opacity:.12;} 36%{opacity:.85;} 60%{opacity:.95;} 100%{opacity:1;}
  }
  @keyframes content-in{ 0%{opacity:0; transform:translateY(14px);} 100%{opacity:1; transform:translateY(0);} }
  @keyframes fade-in{ 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes dust-drift{
    0%{ transform: translate(0,0); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.35; }
    100%{ transform: translate(14px,-140px); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .dark-veil{ animation:none; opacity:0; }
    .lamp-glow{ animation:none; opacity:1; transform:scale(1); }
    .lamp-bulb{ animation:none; opacity:1; }
    .hero-text, .book-focal{ animation:none; opacity:1; transform:none; }
    .dust-field{ animation:none; opacity:1; }
    .dust{ animation:none; }
    .anim-bob{ animation:none; }
  }

  /* ---------- mobile ---------- */
  @media (max-width: 860px){
    .site-nav{ padding: 18px 22px; }
    .hero{
      flex-direction:column; align-items:center; justify-content:flex-end;
      text-align:center; padding: 32px 24px 40px; min-height: 640px;
    }
    .hero-text{ max-width:100%; order:2; }
    .sub{ margin-left:auto; margin-right:auto; }
    .lamp-rig{ right:auto; left:50%; transform:translateX(-50%); }
    .lamp-glow{ right:auto; left:50%; top:-30%; width:820px; height:820px; transform-origin:50% 30%; margin-left:-410px; }
    .book-focal{
      position:relative; right:auto; bottom:auto; order:1;
      width: 260px; height: 250px; margin: 0 auto 18px;
    }
    .mascot-instance{ width:190px; height:206px; }
  }
</style>
</head>
<body>

<svg class="visually-hidden" aria-hidden="true">
  <defs>

      <polygon points="38,150 172,150 172,188 150,210 60,210 38,188" fill="var(--cover-dark)" opacity=".35"/>
      <polygon points="38,62 38,188 18,175 18,75" fill="var(--spine)"/>
      <polygon points="38,62 172,62 192,45 58,45" fill="var(--pages)"/>
      <polygon points="172,62 192,45 192,172 172,188" fill="var(--pages-shadow)"/>
      <polygon points="100,45 116,45 120,100 108,84 96,100" fill="var(--ribbon)"/>
      <polygon points="38,130 18,140 22,162 40,155" fill="var(--cover-dark)"/>

  </defs>
</svg>

<div class="site-nav">
  <div class="brand">
    <svg viewBox="0 0 60 60"><use href="#mascot-tiny"/></svg>
    <span>Researchly</span>
  </div>
  <button class="nav-cta" type="button">Join the waitlist</button>
</div>

<div class="hero">
  <div class="lib-shelves">
    <div class="shelf-row" style="top:4%;"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="shelf-row" style="top:36%;"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="shelf-row" style="top:68%;"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="lamp-glow"></div>

  <div class="dust-field">
    <span class="dust" style="left:52%;top:18%;animation-delay:-2s;"></span>
    <span class="dust" style="left:61%;top:34%;animation-delay:-6s;"></span>
    <span class="dust" style="left:70%;top:12%;animation-delay:-9s;"></span>
    <span class="dust" style="left:66%;top:52%;animation-delay:-3s;"></span>
    <span class="dust" style="left:78%;top:40%;animation-delay:-11s;"></span>
    <span class="dust" style="left:58%;top:66%;animation-delay:-1s;"></span>
    <span class="dust" style="left:85%;top:24%;animation-delay:-7s;"></span>
    <span class="dust" style="left:73%;top:70%;animation-delay:-4.5s;"></span>
    <span class="dust" style="left:48%;top:44%;animation-delay:-13s;"></span>
    <span class="dust" style="left:90%;top:58%;animation-delay:-8.5s;"></span>
  </div>

  <div class="lamp-rig">
    <div class="lamp-cord"></div>
    <svg class="lamp-fixture" viewBox="0 0 92 60">
      <polygon points="34,0 58,0 92,52 0,52" fill="var(--gold)"/>
      <polygon points="34,0 58,0 50,14 42,14" fill="#EAC888"/>
      <polygon points="10,52 82,52 68,40 24,40" fill="var(--wood-deep)" opacity=".55"/>
    </svg>
    <div class="lamp-bulb"></div>
  </div>

  <div class="hero-text">
    <p class="kicker">Waitlist now open</p>
    <h1>Researchly</h1>
    <p class="tagline">Change the world.</p>
    <p class="sub">A short guided interview turns "I don't know where to start" into a personalized map of research programs worth applying to.</p>

</html>
